<symbol id="i-ev" viewBox="0 0 32 32"><rect x="5" y="4" width="13" height="25" rx="2" fill="none"/><path d="M8 9h7v6H8zM18 13h3a2 2 0 0 1 2 2v7a2 2 0 0 0 4 0V11l-3-3M3 29h17M12 19l-2 4h3l-2 4" fill="none"/></symbol>
<symbol id="i-ems" viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="17" rx="2" fill="none"/><path d="M12 28h8M16 23v5M7 18l5-5 4 3 7-6" fill="none"/></symbol>
