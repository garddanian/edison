<symbol id="i-conv" viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="22" rx="3" fill="none"/><path d="M4 27 28 5M8 11h7M18 22c1.5-2 3-2 4.5 0s3 2 4.5 0" fill="none"/></symbol>
