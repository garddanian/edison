<style>
.flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:1 13;animation:f 1.2s linear infinite}
.bi{animation-direction:alternate;animation-duration:2.4s}
@keyframes f{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.flow{animation:none;display:none}}
.ic{stroke:#a8d23a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:#a8d23a}
.ic.ac{stroke:#56c7e3;fill:#56c7e3}
