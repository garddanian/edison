<linearGradient id="bus" x1="0" x2="1"><stop offset="0" stop-color="#7fae1f"/><stop offset=".5" stop-color="#a8d23a"/><stop offset="1" stop-color="#7fae1f"/></linearGradient>
<linearGradient id="busv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7fae1f"/><stop offset=".5" stop-color="#a8d23a"/><stop offset="1" stop-color="#7fae1f"/></linearGradient>
